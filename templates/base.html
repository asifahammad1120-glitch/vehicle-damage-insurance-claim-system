<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Vehicle Claim System{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Vehicle Claim System</a>
            <div class="navbar-nav">
                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'create_claim' %}">New Claim</a>
                    <a class="nav-link" href="{% url 'claim_history' %}">My Claims</a>
                    {% if user.is_staff %}
                        <a class="nav-link" href="{% url 'manage_companies' %}">Companies</a>
                        <a class="nav-link" href="{% url 'manage_vehicles' %}">Vehicles</a>
                        <a class="nav-link" href="/admin/">Admin Panel</a>
                    {% endif %}
                    <a class="nav-link" href="{% url 'company_dashboard' %}">Company Dashboard</a>
                    <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center">
    {% csrf_token %}
    <button type="submit" class="nav-link btn btn-link" style="color: rgba(255,255,255,.55); padding: 0.5rem 1rem; border: none; text-decoration: none;">
        Logout ({{ user.username }})
    </button>
</form>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}">Login</a>
                    <a class="nav-link" href="{% url 'signup' %}">Sign Up</a>
                    <a class="nav-link" href="{% url 'company_signup' %}">Register as Company</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
