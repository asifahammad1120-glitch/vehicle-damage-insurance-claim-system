{% extends "base.html" %}
{% block title %}{{ action }} Vehicle{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h1>{{ action }} Vehicle</h1>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="text-danger">{{ field.errors }}</div>{% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </div>
</div>
{% endblock %}
